version: "2.1"
services:
  rdesktop:
    image: donswanson/kali-headful
    container_name: kali
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN #required: GTK's glycin icon loader needs bwrap sandboxing, else the xfce panel crashes
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      #- /var/run/docker.sock:/var/run/docker.sock #optional
      - ./data:/home/kali #optional
    devices:
      - /dev/dri:/dev/dri #optional
    shm_size: "1gb" #optional
    restart: unless-stopped
    ports:
      - 3389:3389
      - 2222:22


